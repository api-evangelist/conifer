aid: conifer
name: Conifer
description: >-
  Conifer (YC S26) builds Sage, a local-first AI runtime and workspace that runs
  models entirely on your own machine. Its inference engine is written from scratch in
  Rust, reaching up to 60% faster decode than llama.cpp on Apple Silicon, and pairs an
  editor, integrated terminal, file viewers, and an agent runtime inside a kernel-level
  sandbox so tool calls only touch what you allow. Conifer routes each request to the
  cheapest capable model, starting with free on-device inference and falling back to
  cloud only when needed, cutting AI spend by up to 80%. The desktop app ships as
  Juniper for macOS, Windows, and Linux with no accounts, no telemetry, and no cloud
  dependency. Conifer is proprietary and distributed as compiled binaries; it currently
  exposes no public web API.
